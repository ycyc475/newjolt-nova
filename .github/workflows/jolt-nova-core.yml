name: Jolt-Nova Core CI

on:
  push:
    branches:
      - main
      - 'codex/stage-*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ./jolt

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  jolt-nova-core:
    name: jolt-core minimal/nova block checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check -p jolt-core -p tracer

      - name: Check jolt-core minimal
        run: cargo check --locked -p jolt-core --lib --no-default-features --features minimal

      - name: Test jolt-core minimal block path
        run: cargo test --locked -p jolt-core --lib --no-default-features --features minimal block

      - name: Test jolt-core Nova block path
        run: cargo test --locked -p jolt-core --lib --no-default-features --features nova block -- --test-threads=1

      - name: Check Stage-17 Nova BlindFold path
        run: cargo check --locked -p jolt-core --lib --no-default-features --features "nova zk"

      - name: Test Stage-17 recursive BlindFold verifier
        run: cargo test --locked -p jolt-core --lib --no-default-features --features "nova zk" recursive_zk_verifier -- --test-threads=1

      - name: Test clear/ZK execution statement equivalence
        run: cargo test --locked -p jolt-core --lib --no-default-features --features "nova zk" clear_and_zk_receipts_share_the_same_recursive_execution_statement

      - name: Test Stage-18 bounded streaming and attack matrix
        run: cargo test --locked -p jolt-core --lib --no-default-features --features "nova zk" stage18_ -- --test-threads=1

      - name: Compile Stage-18 real Jolt ZK integration
        run: cargo test --locked -p jolt-core --lib --no-default-features --features "host nova zk" fib_e2e_dory_zk_recursive_blindfold --no-run

      - name: Test Stage-19 benchmark schema and runner
        run: cargo test --locked -p jolt-core --example jolt_nova_stage19_benchmark --no-default-features --features "host nova zk"

      - name: Test real ELF trace bundle to Nova and Spartan
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          if RUSTFLAGS="$RUSTFLAGS -A dead-code" cargo test --locked -p jolt-core --example jolt_nova_final_proof_size_benchmark --no-default-features --features nova 2>&1 | tee "$log_file"; then
            exit 0
          fi
          summary="$(tail -n 80 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
          echo "::error title=Real ELF Jolt-Nova runner failed::$summary"
          exit 1
